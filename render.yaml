services:
  - type: web
    name: vin-maps2
    runtime: static
    buildCommand: npm install && npx tsc --project tsconfig.json --pretty false && npx vite build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
