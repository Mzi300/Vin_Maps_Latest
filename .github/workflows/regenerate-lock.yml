name: Regenerate package-lock

on:
  workflow_dispatch: {}

jobs:
  regen-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and regenerate lock
        run: |
          npm ci --prefer-offline --no-audit

      - name: Commit package-lock.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: regenerate package-lock.json (linux)" || true
            git push origin HEAD:feature/osm-visual-prototype
          else
            echo "No changes to package-lock.json"
          fi
