<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Browser Favicon: Upgraded to new premium tactical app icon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#060608" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Open the Mapbox TLS/DNS handshakes during HTML parsing instead of after the JS
         bundle has been parsed and executed. On the Galaxy A02 (mobile data, weak CPU)
         this removes a full DNS + TCP + TLS round trip from the critical path to the map.
         Harmless and non-blocking on desktop. -->
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.mapbox.com" />
    <link rel="preconnect" href="https://events.mapbox.com" crossorigin />
    
    <title>VinMaps | Tactical Intelligence Navigation</title>
    <meta name="description" content="VinMaps: Next-generation AI-powered navigation system with real-time 3D mapping and safety intelligence." />
    
    <!-- OpenGraph SEO Metadata (Ensures the icon shows right when shared on the internet/social media) -->
    <meta property="og:title" content="VinMaps | Tactical Intelligence Navigation" />
    <meta property="og:description" content="Next-generation AI-powered tactical navigation system with real-time 3D mapping and safety intelligence." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    
    <!-- Twitter SEO Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VinMaps | Tactical Intelligence Navigation" />
    <meta name="twitter:description" content="Next-generation AI-powered tactical navigation system with real-time 3D mapping and safety intelligence." />
    <meta name="twitter:image" content="/og-image.png" />
    <!-- Platform flag, set before first paint. On Android/Capacitor the launch must
         show the VinMaps logo ONLY (no wordmark, no loading text, no duplicate art);
         the desktop/browser loader below is left exactly as-is. -->
    <script>
      (function () {
        try {
          var cap = window.Capacitor;
          var isNative = (cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform()) ||
            !!window.androidBridge ||
            location.hostname === 'vinmaps.localhost';
          if (isNative) document.documentElement.classList.add('native-android');
        } catch (e) { /* ignore: fall back to web behaviour */ }
      })();
    </script>
    <!-- STARTUP RECORDER (instrumentation only - no behaviour change).
         Runs before the app bundle so the startup sequence is measurable on a
         real device even before a DevTools session can attach: paint times,
         map container/canvas/marker/loader DOM milestones, the exact cause of
         any startup-failure path, and map resource timings. Read over
         chrome://inspect via window.__vinmapsStartup (see
         scripts/adb-startup-timing.cjs). -->
    <script>
      (function () {
        try {
          var S = window.__vinmapsStartup = { events: [], resources: [], errors: [], seen: {} };
          var ev = function (n, extra) {
            try {
              var rec = { n: n, t: Math.round(performance.now()), d: Date.now() };
              if (extra) for (var k in extra) rec[k] = extra[k];
              S.events.push(rec);
            } catch (e) { /* timing is best-effort only */ }
          };
          ev('recorder-start');
          window.addEventListener('error', function (e) {
            var t = e.target;
            var info = { tag: t && t.tagName, src: t && (t.src || t.href || t.id || ''), msg: (e.message || '').slice(0, 160) };
            S.errors.push(info);
            ev('window-error', info);
          }, true);
          window.addEventListener('unhandledrejection', function (e) {
            var r = e.reason;
            var info = { msg: String(r && (r.message || r)).slice(0, 160) };
            S.errors.push(info);
            ev('unhandled-rejection', info);
          }, true);
          if (typeof PerformanceObserver === 'function') {
            try {
              new PerformanceObserver(function (list) {
                for (var i = 0; i < list.getEntries().length; i++) {
                  var p = list.getEntries()[i];
                  if (p.name === 'first-paint' && !S.firstPaint) { S.firstPaint = Math.round(p.startTime); ev('first-paint'); }
                  if (p.name === 'first-contentful-paint' && !S.firstContentfulPaint) { S.firstContentfulPaint = Math.round(p.startTime); ev('first-contentful-paint'); }
                }
              }).observe({ type: 'paint', buffered: true });
            } catch (e) { /* unsupported */ }
            try {
              new PerformanceObserver(function (list) {
                for (var i = 0; i < list.getEntries().length; i++) {
                  if (S.resources.length >= 500) return;
                  var r = list.getEntries()[i];
                  if (!/mapbox|carto|geoapify|ipapi/i.test(r.name)) continue;
                  S.resources.push({
                    u: r.name.length > 260 ? r.name.slice(0, 260) : r.name,
                    start: Math.round(r.startTime), end: Math.round(r.responseEnd),
                    dur: Math.round(r.duration), transfer: r.transferSize, encoded: r.encodedBodySize
                  });
                }
              }).observe({ type: 'resource', buffered: true });
            } catch (e) { /* unsupported */ }
          }
          var seen = S.seen;
          var watch = function () {
            try {
              if (!seen.container && document.getElementById('map-container')) { seen.container = 1; ev('map-container-added'); }
              if (!seen.canvas && document.querySelector('#map-container canvas')) { seen.canvas = 1; ev('map-canvas-added'); }
              if (!seen.marker && document.querySelector('.user-location-glow')) { seen.marker = 1; ev('marker-visible'); }
              var loader = document.getElementById('startup-loader');
              if (loader && !seen.loaderPresent) { seen.loaderPresent = 1; ev('loader-present'); }
              if (loader && loader.classList.contains('hidden') && !seen.loaderHidden) { seen.loaderHidden = 1; ev('loader-hidden'); }
              if (!loader && seen.loaderPresent && !seen.loaderRemoved) { seen.loaderRemoved = 1; ev('loader-removed'); }
            } catch (e) { /* best-effort */ }
          };
          if (typeof MutationObserver === 'function') {
            new MutationObserver(watch).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
          }
          var iv = setInterval(function () {
            watch();
            if (seen.marker && (seen.loaderHidden || seen.loaderRemoved)) clearInterval(iv);
          }, 100);
        } catch (e) { /* instrumentation must never break startup */ }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <!-- PREMIUM TACTICAL NEON LOADER (Visible instantly with glowing app logo during load) -->
      <div id="startup-loader" class="startup-loader" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #060608;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Inter', system-ui, sans-serif;
        color: #ffffff;
      ">
        <div style="
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 2rem;
        ">
          <!-- Cyan Neon Glow Ring (web only) -->
          <div class="loader-web-only" style="
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid rgba(0, 242, 255, 0.08);
            border-top: 3px solid #00f2ff;
            border-right: 3px solid #00f2ff;
            animation: startup-spin 1s infinite linear;
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.3);
          "></div>
          <!-- Centered Glowing App Logo Asset (always visible) -->
          <img class="splash-logo" src="/logo.png" alt="VinMaps" draggable="false" style="
            position: absolute;
            width: 50px;
            height: 50px;
            object-fit: contain;
            animation: startup-pulse 1.6s infinite ease-in-out;
            user-select: none;
          ">
        </div>
        <div class="loader-web-only" style="
          font-size: 1.1rem;
          font-weight: 900;
          letter-spacing: 3px;
          text-transform: uppercase;
          color: #00f2ff;
          text-shadow: 0 0 12px rgba(0, 242, 255, 0.4);
          margin-bottom: 0.5rem;
          user-select: none;
        ">VinMaps</div>
        <div class="loader-web-only" style="
          font-size: 0.62rem;
          font-weight: 700;
          letter-spacing: 4px;
          color: rgba(255, 255, 255, 0.35);
          text-transform: uppercase;
          user-select: none;
        ">Tactical Navigation Intel</div>
      </div>
      
      <style>
        @keyframes startup-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes startup-pulse {
          0% { transform: scale(0.9); opacity: 0.75; }
          50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.6)); }
          100% { transform: scale(0.9); opacity: 0.75; }
        }
        @keyframes startup-breathe {
          0%, 100% { transform: scale(1); opacity: 0.94; }
          50% { transform: scale(1.05); opacity: 1; }
        }
        /* Native (Android) launch: show ONLY the VinMaps logo, on the same brand colour
           as the native splash, so the two screens read as one continuous logo instead
           of a white frame + duplicated artwork. Desktop/browser is unchanged. */
        html.native-android .loader-web-only { display: none !important; }
        html.native-android .startup-loader { background: #060a13 !important; }
        html.native-android .splash-logo {
          position: static !important;
          width: 168px !important;
          height: 168px !important;
          animation: startup-breathe 2.4s ease-in-out infinite !important;
        }
      </style>
    </div>
    <script>
      (() => {
        let startupFailureShown = false;

        const showStartupFailure = (message) => {
          if (startupFailureShown) return;
          const loader = document.getElementById('startup-loader');
          if (!loader) return;
          startupFailureShown = true;
          loader.remove();

          if (!message) return;

          const error = document.createElement('div');
          error.id = 'startup-error';
          error.textContent = message;
          error.style.cssText = 'position:fixed; top:1rem; left:1rem; right:1rem; z-index:100000; padding:1rem; background:#1a0808; border:1px solid #ff4d4d; color:#ffffff; font:600 0.85rem/1.4 monospace; text-align:center;';
          document.body.appendChild(error);
        };

        window.addEventListener('error', (event) => {
          if (event.error || event.message) showStartupFailure();
        }, true);
        window.addEventListener('unhandledrejection', () => showStartupFailure(), true);
        window.setTimeout(() => {
          if (document.getElementById('startup-loader')) showStartupFailure('');
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
